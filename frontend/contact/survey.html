<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/multimedia/image/images.webp" type="image/x-icon">
    <title>LVM Survey</title>
    <style>
      body {
        min-height: 100vh;
        background: radial-gradient(circle at top left, #0f4fd4 0%, #08182b 44%, #02050b 100%);
      }
      .survey-shell {
        max-width: 1040px;
        margin: 32px auto 16px;
        padding: 18px;
      }
      .survey-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .survey-header h1 {
        margin: 0;
        font-size: clamp(2rem, 2.5vw, 2.8rem);
        color: #9bf0ff;
      }
      .survey-header p {
        margin: 10px 0 0;
        color: #d8f2ff;
        max-width: 720px;
        line-height: 1.7;
      }
      .survey-card {
        background: rgba(7, 18, 44, 0.92);
        border: 1px solid rgba(0, 255, 247, 0.18);
        border-radius: 32px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.26);
        padding: 28px;
      }
      .iframe-shell {
        position: relative;
        overflow: hidden;
        border-radius: 32px;
        border: 1px solid rgba(128, 216, 255, 0.16);
        background: rgba(1, 6, 19, 0.85);
      }
      .iframe-shell::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(135deg, rgba(0,255,247,0.08), transparent 28%, rgba(255,255,255,0.04));
      }
      .gform {
        width: 100%;
        min-height: 78vh;
        border: 0;
        display: block;
      }
      .btn-home {
        min-width: 140px;
      }
      footer.site-footer {
        margin-top: 34px;
      }
      @media (max-width: 820px) {
        .survey-shell {
          padding: 14px;
        }
        .iframe-shell {
          min-height: 68vh;
        }
      }
      @media (max-width: 520px) {
        .survey-header {
          align-items: flex-start;
        }
      }
    </style>
</head>
<body>
    <div class="container survey-shell">
        <div class="survey-header">
            <div>
                <h1>Labsim Von MozzaBot Survey</h1>
                <p>Complete the survey inside the responsive frame below. This layout keeps the form visible and comfortable on desktop and mobile.</p>
            </div>
            <button class="btn btn-home" onclick="window.location.href='../index.html'">
                <i class="fa-solid fa-house"></i> Home
            </button>
        </div>
        <section class="card survey-card">
            <div class="iframe-shell">
                <iframe class="gform" src="https://docs.google.com/forms/d/e/1FAIpQLSfp-OFOJgqwNdkhPBzul2Xk20RgZx9Bt4ixJjF6taBV8rnt5g/viewform?embedded=true" title="Labsim Von MozzaBot Survey">Loading…</iframe>
            </div>
        </section>
    </div>

    <noscript><meta http-equiv="refresh" content="0;url=/error.html"></noscript>
    <footer class="site-footer">
      <div class="footer-inner">
        <p>&copy; 2025 Labsim Von MozzaBot. All rights reserved.</p>
        <p>GNU GPL License v3.0 — Developed by Long Infinity</p>
      </div>
    </footer>
</body>
</html>
