<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemSim - Reaction Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="data.js"></script>
    <script src="particles.js"></script>
    <script src="energy-diagram.js"></script>
</head>
<body>
    <div id="app" class="app-container">
        <!-- Sidebar Controls -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">⚡ ChemSim</h1>
                <p class="app-subtitle">IGCSE 0620 / SPM KSSM Reaction Simulator</p>
            </div>

            <!-- Reaction Selection -->
            <div class="control-section">
                <h2 class="section-title">Select Reaction</h2>
                <div class="reaction-buttons" id="reactionButtons">
                    <!-- Generated by JS -->
                </div>
            </div>

            <!-- Parameters -->
            <div class="control-section">
                <h2 class="section-title">Parameters</h2>
                
                <div class="parameter-group">
                    <div class="parameter-label">
                        <label>Initial Temperature</label>
                        <span class="temp-display" id="tempDisplay">25 °C</span>
                    </div>
                    <input 
                        type="range" 
                        id="tempSlider" 
                        min="0" 
                        max="100" 
                        step="5"
                        value="25"
                        class="slider"
                    />
                </div>

                <div id="catalystContainer" class="catalyst-container" style="display:none;">
                    <div class="checkbox-group">
                        <input type="checkbox" id="catalystCheckbox" class="checkbox">
                        <label for="catalystCheckbox" class="checkbox-label">Add Catalyst <span id="catalystName"></span></label>
                    </div>
                </div>

                <div id="warningContainer" class="warning-box" style="display:none;">
                    <span class="warning-icon">⚠️</span>
                    <span id="warningText"></span>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="control-buttons">
                <button id="playBtn" class="btn btn-primary">
                    <span class="btn-icon">▶</span>
                    START REACTION
                </button>
                <button id="resetBtn" class="btn btn-secondary">↻</button>
            </div>

            <div id="completeMsg" class="complete-message" style="display:none;">
                Reaction Complete
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="content-wrapper">
                <!-- Header Info -->
                <div class="info-header">
                    <div class="header-glow" id="headerGlow"></div>
                    <h2 class="reaction-name" id="reactionName"></h2>
                    <p class="reaction-description" id="reactionDescription"></p>
                    <div class="equation-box" id="equationBox"></div>
                    
                    <div class="header-info">
                        <div class="reaction-type-group">
                            <div class="reaction-type-badge" id="reactionTypeBadge"></div>
                            <span class="enthalpy-display" id="enthalpyDisplay"></span>
                        </div>
                    </div>
                </div>

                <!-- Main Grid -->
                <div class="main-grid">
                    <!-- 3D Scene -->
                    <div class="scene-container">
                        <canvas id="canvas3d" class="canvas-3d"></canvas>
                        <div class="scene-label">
                            <h4 class="label-title">Reactor Chamber</h4>
                            <div class="label-subtitle">Particles shown represent relative stoichiometric amounts</div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="progress-container">
                            <div class="progress-bar-wrapper">
                                <div class="progress-bar" id="progressBar"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Panel (Thermometer + Energy Diagram) -->
                    <div class="right-panel">
                        <!-- Thermometer Widget -->
                        <div class="thermometer-widget">
                            <div class="therm-icon" id="thermIcon">🌡️</div>
                            <h3 class="widget-title">Live Temperature</h3>
                            <div class="temp-value">
                                <span id="liveTemp">25</span><span class="unit">°C</span>
                            </div>
                            <div id="tempTrend" class="temp-trend" style="display:none;"></div>
                        </div>

                        <!-- Energy Profile Diagram -->
                        <div class="energy-profile">
                            <h3 class="diagram-title">Energy Level Diagram</h3>
                            <canvas id="canvasEnergy" class="canvas-energy"></canvas>
                            <div class="diagram-description" id="diagramDescription"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
